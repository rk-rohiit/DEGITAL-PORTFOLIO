<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background and Border Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101c" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Cyber Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Hexagonal / Rounded Shield -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Tech Accent Ring / Ticks -->
  <circle cx="32" cy="32" r="24" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Modern Stylized "R" Logo -->
  <path
    d="M21 16 H35 C41.5 16 45 19.5 45 25 C45 29.5 42 32.5 37.5 33.5 L46 48 H38 L30.5 35 H27.5 V48 H21 V16 Z M27.5 29 H34.5 C37.5 29 39 27.5 39 25 C39 22.5 37.5 21 34.5 21 H27.5 V29 Z"
    fill="url(#rGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Cyber Neon Core Dot (Top Right) -->
  <circle cx="48" cy="16" r="3.5" fill="url(#dotGrad)" filter="url(#neonGlow)" />
  <circle cx="48" cy="16" r="1.5" fill="#ffffff" />
</svg>
